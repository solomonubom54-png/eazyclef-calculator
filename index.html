<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ÊazyClef Calculator</title>
<meta name="description" content="Lot size calculator for ÊazyClef signal followers">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ÊazyClef">
<link rel="manifest" href="#" id="manifest-link">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap');

:root {
  --black: #0a0a0a;
  --surface: #141414;
  --card: #1c1c1c;
  --border: #2a2a2a;
  --gold: #c9a84c;
  --gold-light: #e0c070;
  --white: #f0f0f0;
  --muted: #888;
  --green: #4caf7d;
  --red: #e05252;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  background: var(--black);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo-mark {
  width: 44px;
  height: 44px;
  background: var(--black);
  border: 1.5px solid var(--gold);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-mark svg { width: 38px; height: 38px; }

.brand-text h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--white);
  line-height: 1;
}

.brand-text h1 span { color: var(--gold); }

.brand-text p {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.5px;
  margin-top: 2px;
}

main {
  flex: 1;
  padding: 20px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.8px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.pair-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}

.pair-btn {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}

.pair-btn:hover { border-color: var(--gold); color: var(--white); }
.pair-btn.active { background: #1e1800; border-color: var(--gold); color: var(--gold); }

.setup-row {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

.setup-btn {
  flex: 1;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.5px;
}

.setup-btn.buy.active { background: #0d1e14; border-color: var(--green); color: var(--green); }
.setup-btn.sell.active { background: #1e0d0d; border-color: var(--red); color: var(--red); }

.input-group { margin-bottom: 16px; }

.input-group label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 7px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.input-group input {
  width: 100%;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

.input-group input:focus { border-color: var(--gold); }
.input-group input::placeholder { color: #444; }

.rate-note {
  background: #1a1500;
  border: 1px solid #3a2e00;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #b89a40;
  margin-bottom: 16px;
  display: none;
}

.rate-note.visible { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.rate-refresh {
  background: none;
  border: none;
  cursor: pointer;
  color: #c9a84c;
  flex-shrink: 0;
  padding: 2px;
  opacity: 0.8;
  transition: opacity 0.15s;
}
.rate-refresh:hover { opacity: 1; }
.rate-refresh svg { display: block; }

.calc-btn {
  width: 100%;
  background: var(--gold);
  border: none;
  border-radius: 12px;
  padding: 15px;
  color: #0a0a0a;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.3px;
}

.calc-btn:active { transform: scale(0.98); background: var(--gold-light); }

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.btn-row .calc-btn {
  flex: 1;
  margin-top: 0;
}

.reset-btn {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 15px 20px;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.reset-btn:hover { border-color: var(--red); color: var(--red); }
.reset-btn:active { transform: scale(0.98); }

.results { margin-top: 28px; display: none; }
.results.visible { display: block; }

.results-header {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.result-card.highlight { background: #1a1500; border-color: #3a2e00; }

.result-info { flex: 1; }

.result-label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.result-value {
  font-size: 22px;
  font-weight: 600;
  color: var(--white);
  font-variant-numeric: tabular-nums;
}

.result-card.highlight .result-value { color: var(--gold); }

.copy-btn {
  background: var(--border);
  border: none;
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  flex-shrink: 0;
  margin-left: 12px;
}

.copy-btn:hover { background: #3a3a3a; color: var(--white); }
.copy-btn.copied { background: #0d1e14; color: var(--green); }
.copy-btn svg { display: block; }

.error-msg {
  background: #1e0d0d;
  border: 1px solid #4a1a1a;
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--red);
  font-size: 13px;
  margin-top: 16px;
  display: none;
}

.error-msg.visible { display: block; }

.install-banner {
  position: fixed;
  bottom: calc(20px + var(--safe-bottom));
  left: 16px;
  right: 16px;
  background: var(--surface);
  border: 1.5px solid var(--gold);
  border-radius: 14px;
  padding: 16px;
  display: none;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

.install-banner.visible { display: flex; align-items: center; gap: 14px; }

.install-icon {
  width: 40px;
  height: 40px;
  background: var(--black);
  border: 1px solid var(--gold);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.install-text { flex: 1; }
.install-text strong { display: block; font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 2px; }
.install-text span { font-size: 11px; color: var(--muted); }

.install-actions { display: flex; gap: 8px; flex-shrink: 0; }

.install-yes {
  background: var(--gold);
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  color: #0a0a0a;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

.install-no {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}

.divider { height: 1px; background: var(--border); margin: 24px 0; }

.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(201,168,76,0.3);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.footer-space { height: 40px; }
</style>
</head>
<body>

<header>

    <svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg">
      <rect width="38" height="38" fill="#0a0a0a"/>

<script>
// ── MANIFEST & ICON
function generateIconDataURL(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.lineTo(size-r,0); ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r); ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = size * 0.03; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold italic ${size*0.52}px Georgia,serif`;
  ctx.fillText('E', size*0.06, size*0.68);
  ctx.fillStyle = '#c9a84c';
  ctx.font = `bold italic ${size*0.52}px Georgia,serif`;
  ctx.fillText('C', size*0.44, size*0.78);
  return canvas.toDataURL('image/png');
}

const manifestData = {
  name: "ÊazyClef Calculator",
  short_name: "ÊazyClef",
  start_url: "./",
  display: "standalone",
  background_color: "#0a0a0a",
  theme_color: "#0a0a0a",
  orientation: "portrait",
  icons: [
    { src: generateIconDataURL(192), sizes: "192x192", type: "image/png" },
    { src: generateIconDataURL(512), sizes: "512x512", type: "image/png" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

const appleIcon = document.createElement('link');
appleIcon.rel = 'apple-touch-icon';
appleIcon.href = generateIconDataURL(180);
document.head.appendChild(appleIcon);

// ── SERVICE WORKER
const SW = `
const CACHE='eazyclef-v5';
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
self.addEventListener('fetch',e=>{
  const url = e.request.url;
  if(
    url.includes('frankfurter') ||
    url.includes('googleapis') ||
    url.includes('open.er-api') ||
    url.includes('jsdelivr.net') ||
    url.includes('fawazahmed0')
  ) return;
  e.respondWith(caches.open(CACHE).then(cache=>cache.match(e.request).then(cached=>{
    const fresh=fetch(e.request).then(res=>{cache.put(e.request,res.clone());return res;});
    return cached||fresh;
  })));
});`;
if('serviceWorker' in navigator){
  const swBlob = new Blob([SW],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

// ── PAIR CONFIG
const PAIRS = {
  EURUSD: { spread: 10,   decimals: 5, type: 'usd_quote' },
  GBPUSD: { spread: 10,   decimals: 5, type: 'usd_quote' },
  USDCHF: { spread: 13,   decimals: 5, type: 'usd_base'  },
  AUDUSD: { spread: 10,   decimals: 5, type: 'usd_quote' },
  AUDCHF: { spread: 10,   decimals: 5, type: 'cross_chf' },
  GBPAUD: { spread: 21,   decimals: 5, type: 'cross_aud' },
  XAUUSD: { spread: 1.00, decimals: 3, type: 'gold'      }
};

let selectedPair = null;
let selectedType = null;
let liveRates = {};

// ── FETCH LIVE RATES (3-API fallback chain)
async function fetchWithTimeout(url, ms = 4000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    return res;
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

async function fetchRates(pair) {
  const note = document.getElementById('rate-note');
  const status = document.getElementById('rate-status');
  note.classList.add('visible');
  status.innerHTML = '<span class="spinner"></span>Fetching live rate...';

  const currency = pair === 'AUDCHF' ? 'CHF' : 'AUD';

  async function tryFrankfurter() {
    const res = await fetchWithTimeout(`https://api.frankfurter.app/latest?from=USD&to=${currency}`);
    const data = await res.json();
    return data.rates[currency];
  }

  async function tryExchangeRateAPI() {
    const res = await fetchWithTimeout(`https://open.er-api.com/v6/latest/USD`);
    const data = await res.json();
    return data.rates[currency];
  }

  async function tryFawaz() {
    const res = await fetchWithTimeout(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json`);
    const data = await res.json();
    return data.usd[currency.toLowerCase()];
  }

  let rate = null;
  for (const api of [tryFrankfurter, tryExchangeRateAPI, tryFawaz]) {
    try { rate = await api(); if (rate) break; } catch { continue; }
  }

  if (rate) {
    if (currency === 'CHF') liveRates['USDCHF'] = rate;
    if (currency === 'AUD') liveRates['AUDUSD'] = 1 / rate;
    const label = pair === 'AUDCHF'
      ? `USDCHF ${liveRates['USDCHF'].toFixed(5)}`
      : `AUDUSD ${liveRates['AUDUSD'].toFixed(5)}`;
    status.textContent = `${label}  (live)`;
  } else {
    status.textContent = 'Could not fetch live rate. Enter manually below.';
    showManualInputs(pair);
  }
}

function showManualInputs(pair) {
  if (pair === 'AUDCHF' && !document.getElementById('manual-usdchf-group')) {
    const g = document.createElement('div');
    g.className = 'input-group'; g.id = 'manual-usdchf-group';
    g.innerHTML = `<label>USDCHF Rate</label><input type="number" id="manual-usdchf" placeholder="e.g. 0.88500" step="any" inputmode="decimal">`;
    document.getElementById('rate-note').after(g);
  }
  if (pair === 'GBPAUD' && !document.getElementById('manual-audusd-group')) {
    const g = document.createElement('div');
    g.className = 'input-group'; g.id = 'manual-audusd-group';
    g.innerHTML = `<label>AUDUSD Rate</label><input type="number" id="manual-audusd" placeholder="e.g. 0.64500" step="any" inputmode="decimal">`;
    document.getElementById('rate-note').after(g);
  }
}

function clearManualInputs() {
  ['manual-usdchf-group','manual-audusd-group'].forEach(id => {
    const el = document.getElementById(id); if (el) el.remove();
  });
}

// ── RESET
function resetAll() {
  document.getElementById('entry').value = '';
  document.getElementById('sl').value = '';
  document.getElementById('risk').value = '';
  hideResults();
  hideError();
}

document.getElementById('reset-btn').addEventListener('click', resetAll);

document.getElementById('rate-refresh').addEventListener('click', () => {
  if (selectedPair === 'AUDCHF' || selectedPair === 'GBPAUD') fetchRates(selectedPair);
});

// ── PAIR BUTTONS
document.querySelectorAll('.pair-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedPair = btn.dataset.pair;
    clearManualInputs();
    document.getElementById('rate-note').classList.remove('visible');
    if (selectedPair === 'AUDCHF' || selectedPair === 'GBPAUD') fetchRates(selectedPair);
    resetAll();
  });
});

// ── SETUP BUTTONS
document.querySelectorAll('.setup-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.setup-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    hideResults();
  });
});

// ── HELPERS
document.getElementById('calc-btn').addEventListener('click', calculate);

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.classList.add('visible');
}
function hideError() { document.getElementById('error-msg').classList.remove('visible'); }
function hideResults() {
  document.getElementById('results').classList.remove('visible'); hideError();
}

function addSpread(price, spreadPoints, decimals, isGold) {
  if (isGold) return parseFloat((price + spreadPoints).toFixed(decimals));
  return parseFloat((price + spreadPoints / 100000).toFixed(decimals));
}

function subtractSpread(price, spreadPoints, decimals, isGold) {
  if (isGold) return parseFloat((price - spreadPoints).toFixed(decimals));
  return parseFloat((price - spreadPoints / 100000).toFixed(decimals));
}

function getSLPoints(p1, p2, isGold) {
  if (isGold) return Math.abs(p1 - p2);
  return Math.abs(Math.round(p1 * 100000) - Math.round(p2 * 100000));
}

function calculate() {
  hideError(); hideResults();

  if (!selectedPair) return showError('Please select a currency pair.');
  if (!selectedType) return showError('Please select BUY or SELL.');

  const entry = parseFloat(document.getElementById('entry').value);
  const sl    = parseFloat(document.getElementById('sl').value);
  const risk  = parseFloat(document.getElementById('risk').value);

  if (isNaN(entry) || isNaN(sl) || isNaN(risk)) return showError('Please fill in all fields.');
  if (risk <= 0) return showError('Risk amount must be greater than 0.');
  if (selectedType === 'buy'  && sl >= entry) return showError('For a BUY, SL must be below entry.');
  if (selectedType === 'sell' && sl <= entry) return showError('For a SELL, SL must be above entry.');

  const cfg    = PAIRS[selectedPair];
  const isGold = cfg.type === 'gold';
  const spread = cfg.spread;

  // ── Live/manual rates
  let usdchf = liveRates['USDCHF'];
  let audusd  = liveRates['AUDUSD'];

  if (selectedPair === 'AUDCHF') {
    const m = document.getElementById('manual-usdchf');
    if (m && m.value) usdchf = parseFloat(m.value);
    if (!usdchf) return showError('USDCHF rate not available. Please try again or enter manually.');
  }
  if (selectedPair === 'GBPAUD') {
    const m = document.getElementById('manual-audusd');
    if (m && m.value) audusd = parseFloat(m.value);
    if (!audusd) return showError('AUDUSD rate not available. Please try again or enter manually.');
  }

  // ── Spread adjustment
  // BUY:  entry += spread,    SL -= spread
  // SELL: entry unchanged,    SL += spread × 2
  let adjEntry = entry;
  let adjSL    = sl;

  if (selectedType === 'buy') {
    adjEntry = addSpread(entry, spread, cfg.decimals, isGold);
    adjSL    = subtractSpread(sl, spread, cfg.decimals, isGold);
  } else {
    adjSL    = addSpread(sl, spread * 2, cfg.decimals, isGold);
  }

  // ── SL distance
  const slPoints = getSLPoints(adjEntry, adjSL, isGold);
  if (slPoints === 0) return showError('Entry and SL are too close.');

  // ── Lot size
  let lotSize;
  if (isGold) {
    lotSize = risk / slPoints / 100;
  } else if (cfg.type === 'usd_quote') {
    lotSize = risk / slPoints;
  } else if (cfg.type === 'usd_base') {
    lotSize = (risk * adjEntry) / slPoints;
  } else if (cfg.type === 'cross_chf') {
    lotSize = (risk * usdchf) / slPoints;
  } else if (cfg.type === 'cross_aud') {
    lotSize = risk / audusd / slPoints;
  }

  lotSize = Math.round(lotSize * 100) / 100;

  // ── TP at 1:3
  const slDistance = Math.abs(adjEntry - adjSL);
  let tp;
  if (selectedType === 'buy') {
    tp = parseFloat((adjEntry + slDistance * 3).toFixed(cfg.decimals));
  } else {
    tp = parseFloat((adjEntry - slDistance * 3).toFixed(cfg.decimals));
  }

  // ── Display
  document.getElementById('entry-label').textContent =
    selectedType === 'buy' ? 'Adjusted Entry (+spread)' : 'Entry (unchanged)';
  document.getElementById('sl-label').textContent =
    selectedType === 'buy' ? 'Adjusted SL (−spread)' : 'Adjusted SL (+spread ×2)';

  document.getElementById('result-entry').textContent   = adjEntry.toFixed(cfg.decimals);
  document.getElementById('result-sl').textContent      = adjSL.toFixed(cfg.decimals);
  document.getElementById('result-lotsize').textContent = lotSize.toFixed(2);
  document.getElementById('result-tp').textContent      = tp.toFixed(cfg.decimals);

  document.getElementById('results').classList.add('visible');
  setTimeout(() => {
    document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}

// ── COPY BUTTONS
document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = document.getElementById(btn.dataset.target).textContent;
    navigator.clipboard.writeText(val).then(() => {
      btn.classList.add('copied');
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
      }, 2000);
    });
  });
});

// ── PWA INSTALL
let deferredPrompt = null;
const banner = document.getElementById('install-banner');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!sessionStorage.getItem('ec_dismissed')) {
    setTimeout(() => banner.classList.add('visible'), 1500);
  }
});

document.getElementById('install-yes').addEventListener('click', async () => {
  banner.classList.remove('visible');
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
});

document.getElementById('install-no').addEventListener('click', () => {
  banner.classList.remove('visible');
  sessionStorage.setItem('ec_dismissed', '1');
});

window.addEventListener('appinstalled', () => {
  banner.classList.remove('visible');
  deferredPrompt = null;
});
</script>
