<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ÊazyClef Calculator</title>
<meta name="description" content="Lot size calculator for ÊazyClef signal followers">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ÊazyClef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="manifest" href="#" id="manifest-link">
<style>
:root {
  --black: #0a0a0a; --surface: #141414; --card: #1c1c1c; --border: #2a2a2a;
  --gold: #c9a84c; --gold-light: #e0c070; --white: #f0f0f0; --muted: #888;
  --green: #4caf7d; --red: #e05252;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
body { padding-bottom: var(--safe-bottom); min-height: 100dvh; display: flex; flex-direction: column; }
header { background: var(--black); border-bottom: 1px solid var(--border); padding: 14px 20px; padding-top: calc(14px + var(--safe-top)); display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
.logo-mark { width: 44px; height: 44px; background: var(--black); border: 1.5px solid var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-mark svg { width: 38px; height: 38px; }
.brand-text h1 { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--white); line-height: 1; }
.brand-text h1 span { color: var(--gold); }
.brand-text p { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; margin-top: 2px; }
main { flex: 1; padding: 20px; max-width: 480px; margin: 0 auto; width: 100%; }
.section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.8px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
.pair-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
.pair-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 6px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; text-align: center; }
.pair-btn:hover { border-color: var(--gold); color: var(--white); }
.pair-btn.active { background: #1e1800; border-color: var(--gold); color: var(--gold); }
.setup-row { display: flex; gap: 8px; margin-bottom: 24px; }
.setup-btn { flex: 1; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; letter-spacing: 0.5px; }
.setup-btn.buy.active { background: #0d1e14; border-color: var(--green); color: var(--green); }
.setup-btn.sell.active { background: #1e0d0d; border-color: var(--red); color: var(--red); }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
.input-group input { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 16px; color: var(--white); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
.input-group input:focus { border-color: var(--gold); }
.input-group input::placeholder { color: #444; }
.rate-note { background: #1a1500; border: 1px solid #3a2e00; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #b89a40; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; gap: 10px; }
.rate-note.visible { display: flex; }
.rate-note.error { background: #1e0d0d; border-color: #4a1a1a; color: var(--red); }
.rate-refresh { background: none; border: none; cursor: pointer; color: #c9a84c; flex-shrink: 0; padding: 2px; opacity: 0.8; transition: opacity 0.15s; }
.rate-refresh:hover { opacity: 1; }
.rate-refresh svg { display: block; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.calc-btn { flex: 1; background: var(--gold); border: none; border-radius: 12px; padding: 15px; color: #0a0a0a; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.1s; letter-spacing: 0.3px; }
.calc-btn:active { transform: scale(0.98); background: var(--gold-light); }
.reset-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 15px 20px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.reset-btn:hover { border-color: var(--red); color: var(--red); }
.reset-btn:active { transform: scale(0.98); }
.results { margin-top: 28px; display: none; }
.results.visible { display: block; }
.results-header { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px; }
.result-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.result-card.highlight { background: #1a1500; border-color: #3a2e00; }
.result-card.warning { background: #1a1000; border-color: #5a3500; }
.result-info { flex: 1; }
.result-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.3px; }
.result-value { font-size: 22px; font-weight: 600; color: var(--white); font-variant-numeric: tabular-nums; }
.result-card.highlight .result-value { color: var(--gold); }
.result-card.warning .result-value { color: #e09020; }
.lot-options { display: flex; gap: 8px; margin-top: 10px; }
.lot-option-btn { flex: 1; background: var(--border); border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 8px; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.4; }
.lot-option-btn:hover { border-color: var(--gold); color: var(--white); }
.copy-btn { background: var(--border); border: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--muted); transition: all 0.15s; flex-shrink: 0; margin-left: 12px; }
.copy-btn:hover { background: #3a3a3a; color: var(--white); }
.copy-btn.copied { background: #0d1e14; color: var(--green); }
.copy-btn svg { display: block; }
.error-msg { background: #1e0d0d; border: 1px solid #4a1a1a; border-radius: 8px; padding: 12px 16px; color: var(--red); font-size: 13px; margin-top: 16px; display: none; }
.error-msg.visible { display: block; }
.install-banner { position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 16px; right: 16px; background: var(--surface); border: 1.5px solid var(--gold); border-radius: 14px; padding: 16px; display: none; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
.install-banner.visible { display: flex; align-items: center; gap: 14px; }
.install-icon { width: 40px; height: 40px; background: var(--black); border: 1px solid var(--gold); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.install-text { flex: 1; }
.install-text strong { display: block; font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 2px; }
.install-text span { font-size: 11px; color: var(--muted); }
.install-actions { display: flex; gap: 8px; flex-shrink: 0; }
.install-yes { background: var(--gold); border: none; border-radius: 8px; padding: 8px 14px; color: #0a0a0a; font-weight: 700; font-size: 13px; cursor: pointer; }
.install-no { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--muted); font-size: 13px; cursor: pointer; }
.divider { height: 1px; background: var(--border); margin: 24px 0; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(201,168,76,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.footer-space { height: 40px; }
</style>
</head>
<body>
<header>

  <div class="section-label">Select Pair</div>
  <div class="pair-grid">
    <button class="pair-btn" data-pair="EURUSD">EURUSD</button>
    <button class="pair-btn" data-pair="GBPUSD">GBPUSD</button>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

</main>
<div class="install-banner" id="install-banner">
  <div class="install-icon">
    <svg width="22" height="22" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg">
      <text x="2" y="26" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white" font-style="italic">E</text>
      <text x="16" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#c9a84c" font-style="italic">C</text>
    </svg>
  </div>

    <strong>Add to Home Screen</strong>
    <span>Install ÊazyClef Calculator</span>
  </div>

    <button class="install-yes" id="install-yes">Install</button>
    <button class="install-no" id="install-no">✕</button>

<script>
function generateIconDataURL(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.lineTo(size-r,0); ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r); ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = size * 0.03; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold italic ' + (size*0.52) + 'px Georgia,serif';
  ctx.fillText('E', size*0.06, size*0.68);
  ctx.fillStyle = '#c9a84c';
  ctx.font = 'bold italic ' + (size*0.52) + 'px Georgia,serif';
  ctx.fillText('C', size*0.44, size*0.78);
  return canvas.toDataURL('image/png');
}
const manifestData = {
  name: "ÊazyClef Calculator", short_name: "ÊazyClef", start_url: "./",
  display: "standalone", background_color: "#0a0a0a", theme_color: "#0a0a0a", orientation: "portrait",
  icons: [{ src: generateIconDataURL(192), sizes: "192x192", type: "image/png" }, { src: generateIconDataURL(512), sizes: "512x512", type: "image/png" }]
};
const manifestBlob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
const appleIcon = document.createElement('link');
appleIcon.rel = 'apple-touch-icon'; appleIcon.href = generateIconDataURL(180);
document.head.appendChild(appleIcon);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}

const PAIRS = {
  EURUSD: { spread: 10,   decimals: 5, type: 'usd_quote' },
  GBPUSD: { spread: 10,   decimals: 5, type: 'usd_quote' },
  USDCHF: { spread: 13,   decimals: 5, type: 'usd_base'  },
  AUDUSD: { spread: 10,   decimals: 5, type: 'usd_quote' },
  AUDCHF: { spread: 10,   decimals: 5, type: 'cross_chf' },
  GBPAUD: { spread: 21,   decimals: 5, type: 'cross_aud' },
  XAUUSD: { spread: 1.00, decimals: 3, type: 'gold'      }
};

let selectedPair = null, selectedType = null, liveRates = {}, retryTimer = null, onlineHandler = null;

async function fetchWithTimeout(url, options, ms) {
  ms = ms || 5000;
  options = options || {};
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    clearTimeout(timer); return res;
  } catch(e) { clearTimeout(timer); throw e; }
}

async function fetchRates(pair) {
  const note = document.getElementById('rate-note');
  const status = document.getElementById('rate-status');
  note.classList.remove('error'); note.classList.add('visible');
  status.innerHTML = '<span class="spinner"></span>Fetching live rate...';
  const currency = pair === 'AUDCHF' ? 'CHF' : 'AUD';
  const t = Date.now();

  async function tryER() {
    const res = await fetchWithTimeout('https://open.er-api.com/v6/latest/USD?_=' + t);
    const data = await res.json(); return data.rates[currency];
  }
  async function tryFR() {
    const res = await fetchWithTimeout('https://api.frankfurter.app/latest?from=USD&to=' + currency + '&_=' + t);
    const data = await res.json(); return data.rates[currency];
  }

  let rate = null;
  for (const api of [tryER, tryFR]) {
    try {
      if (pair !== selectedPair) return;
      rate = await api(); if (rate) break;
    } catch(e) { continue; }
  }
  if (pair !== selectedPair) return;

  if (rate) {
    clearRetry();
    if (currency === 'CHF') liveRates['USDCHF'] = rate;
    if (currency === 'AUD') liveRates['AUDUSD'] = 1 / rate;
    const label = pair === 'AUDCHF' ? 'USDCHF ' + liveRates['USDCHF'].toFixed(5) : 'AUDUSD ' + liveRates['AUDUSD'].toFixed(5);
    note.classList.remove('error');
    status.textContent = label + '  (live)';
  } else {
    showNetworkError(pair);
  }
}

function showNetworkError(pair) {
  const note = document.getElementById('rate-note');
  const status = document.getElementById('rate-status');
  note.classList.add('error');
  status.textContent = "Can't load live rate. Check your connection — will reconnect automatically.";
  clearRetry();
  retryTimer = setInterval(async () => { if (selectedPair === pair) await fetchRates(pair); }, 10000);
  onlineHandler = async () => { if (selectedPair === pair) await fetchRates(pair); };
  window.addEventListener('online', onlineHandler);
}

function clearRetry() {
  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
  if (onlineHandler) { window.removeEventListener('online', onlineHandler); onlineHandler = null; }
}

document.querySelectorAll('.pair-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.pair-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    selectedPair = btn.dataset.pair;
    clearRetry();
    document.getElementById('rate-note').classList.remove('visible', 'error');
    if (selectedPair === 'AUDCHF' || selectedPair === 'GBPAUD') fetchRates(selectedPair);
    resetAll();
  });
});

document.querySelectorAll('.setup-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.setup-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    hideResults();
  });
});

['entry','sl','risk'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', hideResults);
});

function resetAll() {
  document.getElementById('entry').value = '';
  document.getElementById('sl').value = '';
  document.getElementById('risk').value = '';
  hideResults(); hideError();
}

document.getElementById('reset-btn').addEventListener('click', resetAll);
document.getElementById('rate-refresh').addEventListener('click', function() {
  if (selectedPair === 'AUDCHF' || selectedPair === 'GBPAUD') fetchRates(selectedPair);
});

function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.classList.add('visible'); }
function hideError() { document.getElementById('error-msg').classList.remove('visible'); }
function hideResults() {
  document.getElementById('results').classList.remove('visible');
  document.getElementById('lot-options-container').innerHTML = '';
  document.getElementById('lotsize-card').classList.remove('warning');
  document.getElementById('actual-risk-card').classList.remove('warning');
  hideError();
}

function addSpread(price, sp, dec, isGold) {
  if (isGold) return parseFloat((price + sp).toFixed(dec));
  return parseFloat((price + sp / 100000).toFixed(dec));
}
function subtractSpread(price, sp, dec, isGold) {
  if (isGold) return parseFloat((price - sp).toFixed(dec));
  return parseFloat((price - sp / 100000).toFixed(dec));
}
function getSLPoints(p1, p2, isGold) {
  if (isGold) return Math.abs(p1 - p2);
  return Math.abs(Math.round(p1 * 100000) - Math.round(p2 * 100000));
}
function calcActualRisk(lot, slPts, cfg, adjEntry, usdchf, audusd) {
  if (cfg.type === 'gold')      return lot * slPts * 100;
  if (cfg.type === 'usd_quote') return lot * slPts;
  if (cfg.type === 'usd_base')  return (lot * slPts) / adjEntry;
  if (cfg.type === 'cross_chf') return (lot * slPts) / usdchf;
  if (cfg.type === 'cross_aud') return lot * slPts * audusd;
  return 0;
}

document.getElementById('calc-btn').addEventListener('click', calculate);

function calculate() {
  hideError(); hideResults();
  if (!selectedPair) return showError('Please select a currency pair.');
  if (!selectedType) return showError('Please select a direction.');
  const entry = parseFloat(document.getElementById('entry').value);
  const sl    = parseFloat(document.getElementById('sl').value);
  const risk  = parseFloat(document.getElementById('risk').value);
  if (isNaN(entry) || isNaN(sl) || isNaN(risk)) return showError('Please fill in all fields.');
  if (risk <= 0) return showError('Risk amount must be greater than 0.');
  if (selectedType === 'buy'  && sl >= entry) return showError('For a BUY, SL must be below entry.');
  if (selectedType === 'sell' && sl <= entry) return showError('For a SELL, SL must be above entry.');

  const cfg = PAIRS[selectedPair];
  const isGold = cfg.type === 'gold';
  const spread = cfg.spread;
  const usdchf = liveRates['USDCHF'];
  const audusd = liveRates['AUDUSD'];
  if (selectedPair === 'AUDCHF' && !usdchf) return showError('Live rate not available. Check connection and retry.');
  if (selectedPair === 'GBPAUD' && !audusd)  return showError('Live rate not available. Check connection and retry.');

  let adjEntry = entry, adjSL = sl;
  if (selectedType === 'buy') {
    adjEntry = addSpread(entry, spread, cfg.decimals, isGold);
    adjSL    = subtractSpread(sl, spread, cfg.decimals, isGold);
  } else {
    adjSL = addSpread(sl, spread * 2, cfg.decimals, isGold);
  }

  const slPoints = getSLPoints(adjEntry, adjSL, isGold);
  if (slPoints === 0) return showError('Entry and SL are too close.');

  let exactLot;
  if (isGold)                    exactLot = risk / slPoints / 100;
  else if (cfg.type==='usd_quote') exactLot = risk / slPoints;
  else if (cfg.type==='usd_base')  exactLot = (risk * adjEntry) / slPoints;
  else if (cfg.type==='cross_chf') exactLot = (risk * usdchf) / slPoints;
  else if (cfg.type==='cross_aud') exactLot = risk / audusd / slPoints;

  const slDistance = Math.abs(adjEntry - adjSL);
  const tp = selectedType === 'buy'
    ? parseFloat((adjEntry + slDistance * 3).toFixed(cfg.decimals))
    : parseFloat((adjEntry - slDistance * 3).toFixed(cfg.decimals));

  document.getElementById('entry-label').textContent = selectedType === 'buy' ? 'Adjusted Entry (+spread)' : 'Entry (unchanged)';
  document.getElementById('sl-label').textContent    = selectedType === 'buy' ? 'Adjusted SL (\u2212spread)' : 'Adjusted SL (+spread \xd72)';
  document.getElementById('result-entry').textContent = adjEntry.toFixed(cfg.decimals);
  document.getElementById('result-sl').textContent    = adjSL.toFixed(cfg.decimals);
  document.getElementById('result-tp').textContent    = tp.toFixed(cfg.decimals);
  document.getElementById('results').classList.add('visible');

  if (exactLot < 0.01) {
    const minRisk = calcActualRisk(0.01, slPoints, cfg, adjEntry, usdchf, audusd);
    document.getElementById('result-lotsize').textContent = '\u2014';
    document.getElementById('result-actual-risk').textContent = '\u2014';
    document.getElementById('lotsize-card').classList.add('warning');
    document.getElementById('lot-options-container').innerHTML =
      '<div style="font-size:12px;color:#e09020;margin-top:8px;line-height:1.5;">Risk too small for 0.01 lot minimum.<br>0.01 lot would risk <strong>$' + minRisk.toFixed(2) + '</strong>.</div>' +
      '<div class="lot-options">' +
      '<button class="lot-option-btn" id="yes-min-lot">Use 0.01 lot ($' + minRisk.toFixed(2) + ')</button>' +
      '<button class="lot-option-btn" id="no-min-lot">Cancel</button></div>';
    document.getElementById('yes-min-lot').addEventListener('click', function() {
      applyLotSize(0.01, slPoints, cfg, adjEntry, usdchf, audusd, risk);
      document.getElementById('lot-options-container').innerHTML = '';
      document.getElementById('lotsize-card').classList.remove('warning');
    });
    document.getElementById('no-min-lot').addEventListener('click', hideResults);
    setTimeout(function() { document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'}); }, 100);
    return;
  }

  const floorLot  = Math.floor(exactLot * 100) / 100;
  const floorRisk = calcActualRisk(floorLot, slPoints, cfg, adjEntry, usdchf, audusd);
  const overLot   = parseFloat((floorLot + 0.01).toFixed(2));
  const overRisk  = calcActualRisk(overLot, slPoints, cfg, adjEntry, usdchf, audusd);
  const pctOver   = ((overRisk - risk) / risk) * 100;

  if (pctOver > 10) {
    document.getElementById('result-lotsize').textContent = '\u2014';
    document.getElementById('result-actual-risk').textContent = '\u2014';
    document.getElementById('lotsize-card').classList.add('warning');
    document.getElementById('lot-options-container').innerHTML =
      '<div style="font-size:12px;color:#e09020;margin-top:8px;">Choose lot size:</div>' +
      '<div class="lot-options">' +
      '<button class="lot-option-btn" id="opt-floor">' + floorLot.toFixed(2) + ' lot \u2014 $' + floorRisk.toFixed(2) + ' risk</button>' +
      '<button class="lot-option-btn" id="opt-over">' + overLot.toFixed(2) + ' lot \u2014 $' + overRisk.toFixed(2) + ' (+' + pctOver.toFixed(0) + '%)</button></div>';
    document.getElementById('opt-floor').addEventListener('click', function() {
      applyLotSize(floorLot, slPoints, cfg, adjEntry, usdchf, audusd, risk);
      document.getElementById('lot-options-container').innerHTML = '';
      document.getElementById('lotsize-card').classList.remove('warning');
    });
    document.getElementById('opt-over').addEventListener('click', function() {
      applyLotSize(overLot, slPoints, cfg, adjEntry, usdchf, audusd, risk);
      document.getElementById('lot-options-container').innerHTML = '';
      document.getElementById('lotsize-card').classList.remove('warning');
    });
  } else {
    applyLotSize(floorLot, slPoints, cfg, adjEntry, usdchf, audusd, risk);
  }

  setTimeout(function() { document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'}); }, 100);
}

function applyLotSize(lot, slPoints, cfg, adjEntry, usdchf, audusd, intendedRisk) {
  const actualRisk = calcActualRisk(lot, slPoints, cfg, adjEntry, usdchf, audusd);
  document.getElementById('result-lotsize').textContent = lot.toFixed(2);
  document.getElementById('result-actual-risk').textContent = '$' + actualRisk.toFixed(2);
  const card = document.getElementById('actual-risk-card');
  card.classList.remove('warning');
  if (((actualRisk - intendedRisk) / intendedRisk) * 100 > 10) card.classList.add('warning');
}

document.querySelectorAll('.copy-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const el = document.getElementById(btn.dataset.target);
    const val = el ? el.textContent : '';
    if (!val || val === '\u2014') return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).then(function() { showCopied(btn); }).catch(function() { fallbackCopy(btn, val); });
    } else { fallbackCopy(btn, val); }
  });
});

function showCopied(btn) {
  btn.classList.add('copied');
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  setTimeout(function() {
    btn.classList.remove('copied');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  }, 2000);
}

function fallbackCopy(btn, val) {
  try {
    const ta = document.createElement('textarea');
    ta.value = val; ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showCopied(btn);
  } catch(e) {
    btn.title = 'Press and hold to copy';
    btn.style.borderColor = 'var(--gold)';
    setTimeout(function() { btn.style.borderColor = ''; }, 2000);
  }
}

let deferredPrompt = null;
const banner = document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault(); deferredPrompt = e;
  if (!sessionStorage.getItem('ec_dismissed')) setTimeout(function() { banner.classList.add('visible'); }, 1500);
});
document.getElementById('install-yes').addEventListener('click', async function() {
  banner.classList.remove('visible');
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
});
document.getElementById('install-no').addEventListener('click', function() {
  banner.classList.remove('visible'); sessionStorage.setItem('ec_dismissed', '1');
});
window.addEventListener('appinstalled', function() { banner.classList.remove('visible'); deferredPrompt = null; });
</script>
